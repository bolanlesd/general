name: ci
on:
  push:
    branches: [master-mac]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck on bash scripts
        run: |
          find scripts bin -type f \( -name '*.sh' -o -path 'bin/*' \) \
            -exec shellcheck -x -S warning {} +

  zsh-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Syntax-check every module
        run: |
          set -e
          for f in shell/zshrc shell/parts/*.zsh dist/zshrc; do
            echo "-- $f"
            zsh -n "$f"
          done
      - name: Verify dist/zshrc is up to date
        run: |
          bash scripts/build-zshrc.sh
          git diff --exit-code dist/zshrc

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats + zsh
        run: sudo apt-get update && sudo apt-get install -y bats zsh
      - name: Run bats tests
        run: bats tests/
